name: CI com Gradle, OWASP e Trivy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Setup do Java 17
        id: setup-java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          java-package: 'jdk'
          cache: 'gradle'

      - name: Debug JAVA_HOME
        run: echo "JAVA_HOME is set to $JAVA_HOME"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build com Gradle
        run: ./gradlew build -x test

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'demo-git-actions'
          format: 'HTML'
          path: '.'
          out: 'dependency-check-report'
          args: >
            --failOnCVSS 7
            --log odc.log
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}  # Usando a variável de ambiente já definida pelo setup-java
          DEBUG: true

      - name: Verifica vulnerabilidades críticas no OWASP
        if: always()  # Executa mesmo se etapas anteriores falharem
        run: |
          if [ -f dependency-check-report.xml ]; then
            if grep -qE 'severity="(Critical|High)"' dependency-check-report.xml; then
              echo "🚨 Vulnerabilidades CRÍTICAS encontradas no OWASP!";
              exit 1;
            else
              echo "✅ Nenhuma vulnerabilidade crítica encontrada no OWASP.";
            fi
          else
            echo "⚠️ Arquivo de relatório não encontrado";
          fi

      - name: Upload do relatório OWASP como artefato
        if: always()  # Executa mesmo se etapas anteriores falharem
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report.html