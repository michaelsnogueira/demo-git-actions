name: CI com Gradle, OWASP e Trivy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Setup do Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build com Gradle
        run: ./gradlew build -x test

      - name: Executar OWASP Dependency Check
        id: owasp-check
        uses: OWASP/dependency-check-action@main
        with:
          project: 'demo-git-actions'
          format: 'HTML'
          scan-dir: '.'
          output: 'dependency-check-report'
          fail-on-cvss: 7
          additional-arguments: '--log odc.log'

      - name: Verificar se relatório foi gerado
        run: |
          ls -la dependency-check-report*
          if [ ! -f dependency-check-report.xml ]; then
            echo "::error::Relatório OWASP não foi gerado!"
            exit 1
          fi

      - name: Verificar vulnerabilidades críticas
        if: always()
        run: |
          if [ -f dependency-check-report.xml ]; then
            if grep -qE 'severity="(Critical|High)"' dependency-check-report.xml; then
              echo "::error::Vulnerabilidades CRÍTICAS encontradas no OWASP!"
              exit 1
            else
              echo "✅ Nenhuma vulnerabilidade crítica encontrada no OWASP."
            fi
          else
            echo "::warning::Arquivo de relatório não encontrado"
          fi

      - name: Upload do relatório OWASP
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: dependency-check-report
          path: |
            dependency-check-report.html
            dependency-check-report.xml
            odc.log