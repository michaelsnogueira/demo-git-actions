name: CI com Gradle, OWASP e Trivy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04  # <<< VERSÃO ESTÁVEL DO RUNNER

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Setup do Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build com Gradle
        run: ./gradlew build -x test

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@4.6.2
        with:
          project: 'demo-git-actions'
          format: 'HTML'
          path: '.'
          out: 'dependency-check-report'
          args: >
            --enableExperimental
            --failOnCVSS 7
            --log odc.log

      - name: Verifica vulnerabilidades críticas no OWASP
        run: |
          if grep -qE 'severity="(Critical|High)"' dependency-check-report.xml; then
            echo "🚨 Vulnerabilidades CRÍTICAS encontradas no OWASP!";
            exit 1;
          else
            echo "✅ Nenhuma vulnerabilidade crítica encontrada no OWASP.";
          fi

      - name: Upload do relatório OWASP como artefato
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dependency-check-report
          path: dependency-check-report.html

      - name: Build da imagem Docker
        run: docker build -t demo-app .

      - name: Scan de vulnerabilidades com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: demo-app
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Exportar relatório Trivy
        run: |
          trivy image --severity CRITICAL,HIGH demo-app > trivy-results.txt || true

      - name: Upload do relatório Trivy como artefato
        uses: actions/upload-artifact@v4.6.2
        with:
          name: trivy-results
          path: trivy-results.txt